name: FunzooKids Auto Video Upgrader

on:
  workflow_dispatch:
    inputs:
      file_id:
        description: 'Telegram Video File ID'
        required: false
      chat_id:
        description: 'Telegram Chat ID'
        required: false
      caption:
        description: 'User Hint'
        required: false

jobs:
  process-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg & Audio Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install requests edge-tts

      - name: Run Video Upgrader Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INPUT_FILE_ID: ${{ github.event.inputs.file_id }}
          INPUT_CHAT_ID: ${{ github.event.inputs.chat_id }}
          INPUT_CAPTION: ${{ github.event.inputs.caption }}
        run: python bot.py
