name: FunzooKids 24/7 Engine

on:
  schedule:
    # 1. Shorts Mode: Tue, Wed, Fri, Sun at 11:00 AM IST (05:30 UTC)
    - cron: '30 05 * * 0,2,3,5'
    # 2. Long Form Mode: Mon, Thu, Sat at 10:00 PM IST (16:30 UTC)
    - cron: '30 16 * * 1,4,6'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-generativeai

      - name: Run Studio Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MY_CHANNEL_ID: ${{ secrets.MY_CHANNEL_ID }}
        run: python bot.py
