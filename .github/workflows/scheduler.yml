name: High-Retention Explainer Cloud Engine
run-name: "${{ github.event_name == 'schedule' && 'Scheduled 24h Cloudinary Cleanup' || format('Explainer Render [{0}]', inputs.run_tag) }}"

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      video_source:
        description: 'Raw Video URL, Messy Share-Text, or Cloudinary Upload URL'
        required: true
        type: string
      source_type:
        description: 'link or upload'
        required: true
        default: 'link'
        type: string
      language:
        description: 'Output Language (en or hi)'
        required: false
        default: 'en'
        type: string
      voice_gender:
        description: 'Voice Gender (male or female)'
        required: false
        default: 'male'
        type: string
      custom_angle:
        description: 'Optional Custom Suspense Hook or Explanation Angle'
        required: false
        default: ''
        type: string
      character_enabled:
        description: 'Enable Talking Character Pattern Interrupts (true or false)'
        required: false
        default: 'false'
        type: string
      character_url:
        description: 'Cloudinary URL of Character Portrait'
        required: false
        default: ''
        type: string
      outfit_prompt:
        description: 'Optional Outfit Change Prompt (Face-Locked)'
        required: false
        default: ''
        type: string
      run_tag:
        description: 'Unique Studio Run Tag for Cloudinary & Correlation'
        required: true
        type: string
      session_cookie:
        description: 'Optional Session Cookie for Restricted Links'
        required: false
        default: ''
        type: string

jobs:
  cloudinary-cleanup:
    name: 24-Hour Cloudinary Auto-Cleanup
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Cleanup Dependencies
        run: pip install --quiet cloudinary requests

      - name: Purge Expired 24h Cloudinary Assets
        run: python process_video.py --cleanup-only

  render-explainer:
    name: 7GB Cloud Production Video Engine
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
      WAV2LIP_ONNX_URL: ${{ secrets.WAV2LIP_ONNX_URL }}
      VIDEO_SOURCE: ${{ github.event.inputs.video_source }}
      SOURCE_TYPE: ${{ github.event.inputs.source_type }}
      LANGUAGE: ${{ github.event.inputs.language }}
      VOICE_GENDER: ${{ github.event.inputs.voice_gender }}
      CUSTOM_ANGLE: ${{ github.event.inputs.custom_angle }}
      CHARACTER_ENABLED: ${{ github.event.inputs.character_enabled }}
      CHARACTER_URL: ${{ github.event.inputs.character_url }}
      OUTFIT_PROMPT: ${{ github.event.inputs.outfit_prompt }}
      RUN_TAG: ${{ github.event.inputs.run_tag }}
      SESSION_COOKIE: ${{ github.event.inputs.session_cookie }}
      MODEL_CACHE_DIR: /home/runner/.cache/explainer-models
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache ONNX & Playwright Chromium Browsers
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/.cache/explainer-models
            /home/runner/.cache/ms-playwright
          key: explainer-runtime-v4-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            explainer-runtime-v4-

      - name: Install FFmpeg, Latest yt-dlp, Playwright Chromium & Dependencies
        run: |
          if [ -n "$SESSION_COOKIE" ]; then
            echo "::add-mask::$SESSION_COOKIE"
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-noto-core fonts-lohit-deva
          pip install --quiet --upgrade pip
          pip install --quiet -r requirements.txt
          pip install --quiet -U yt-dlp
          playwright install chromium --with-deps

      - name: Fetching Link
        run: |
          if [ -n "$SESSION_COOKIE" ]; then
            echo "::add-mask::$SESSION_COOKIE"
          fi
          python process_video.py --stage fetch

      - name: 1-FPS Scan & Trend Research
        run: python process_video.py --stage analyze

      - name: Suspense Voice & Character
        run: python process_video.py --stage voice_character

      - name: Anti-Copyright Render
        run: python process_video.py --stage render

      - name: Publish & Cleanup
        run: python process_video.py --stage publish

      - name: Save Render Manifest Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: render-manifest-${{ github.event.inputs.run_tag }}
          path: result_manifest.json
          retention-days: 7

      - name: Cleanup Raw Upload on Failure
        if: failure()
        run: python process_video.py --stage cleanup_raw
