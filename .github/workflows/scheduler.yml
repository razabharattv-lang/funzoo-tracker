name: FunzooKids Auto Video Upgrader

on:
  schedule:
    - cron: '*/10 * * * *'   # हर 10 मिनट में चेक करेगा कि आपने कोई वीडियो भेजा है या नहीं
  workflow_dispatch:         # फोन से तुरंत चलाने के लिए (Run workflow बटन)

jobs:
  process-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg & Audio Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install requests edge-tts

      - name: Run Video Upgrader Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python bot.py
